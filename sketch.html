<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Ball Animation</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    body { margin: 0; background: #1a1a2e; display: flex; justify-content: center; align-items: center; height: 100vh; }
  </style>
</head>
<body>
<script>
let x;
const y = 200;
const diameter = 50;
const speed = 3;

function setup() {
  createCanvas(800, 400);
  x = -diameter;
}

function draw() {
  background(26, 26, 46);

  // Draw ball
  noStroke();
  fill(255, 100, 100);
  circle(x, y, diameter);

  // Move ball
  x += speed;

  // Wrap around when it exits the right edge
  if (x > width + diameter) {
    x = -diameter;
  }
}
</script>
</body>
</html>
